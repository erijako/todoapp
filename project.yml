# XcodeGen spec. Run `xcodegen generate` to create TodoApp.xcodeproj.
# App name and bundle IDs are placeholders until the final name is chosen.
name: TodoApp

options:
  bundleIdPrefix: com.erijako
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

fileGroups:
  - StoreKit

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  TodoApp:
    type: application
    platform: iOS
    sources:
      - path: TodoApp
      - path: Shared
    info:
      path: TodoApp/Info.plist
      properties:
        CFBundleDisplayName: Onestep
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        # v1.1 Sharing: CloudKit silent pushes + accepting iCloud share links.
        UIBackgroundModes:
          - remote-notification
        CKSharingSupported: true
        CFBundleURLTypes:
          - CFBundleURLName: com.erijako.onestep
            CFBundleURLSchemes:
              - onestep
    entitlements:
      path: TodoApp/TodoApp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.erijako.onestep
        # v1.1 Sharing (enabled on the App ID 2026-11-24). Environments differ per configuration
        # so local Debug builds use development and TestFlight/App Store use production.
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.erijako.onestep
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-environment: $(ICLOUD_CONTAINER_ENVIRONMENT)
        aps-environment: $(APS_ENVIRONMENT)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.erijako.onestep
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          APS_ENVIRONMENT: development
          ICLOUD_CONTAINER_ENVIRONMENT: Development
        Release:
          APS_ENVIRONMENT: production
          ICLOUD_CONTAINER_ENVIRONMENT: Production
    dependencies:
      - target: TodoWidget
    scheme:
      # Local StoreKit testing in Xcode (no App Store Connect needed).
      storeKitConfiguration: StoreKit/Products.storekit

  TodoWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: TodoWidget
      - path: Shared
    info:
      path: TodoWidget/Info.plist
      properties:
        CFBundleDisplayName: Onestep
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: TodoWidget/TodoWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.erijako.onestep
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.erijako.onestep.widget
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
