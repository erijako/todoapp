name: TestFlight

# Builds a signed release and uploads it to App Store Connect (TestFlight).
# Switched off until the Apple Developer account is approved: it only runs when the
# repository variable TESTFLIGHT_ENABLED is "true". Setup: docs/testflight.md

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  upload:
    name: Archive and upload
    if: ${{ vars.TESTFLIGHT_ENABLED == 'true' }}
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          for name in TEAM_ID KEY_ID ISSUER_ID; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret for $name (see docs/testflight.md)"; exit 1; fi
          done

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "::error::No Xcode 26 on this runner"; ls -d /Applications/Xcode*.app; exit 1; fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Write App Store Connect API key
        env:
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey.p8" >> "$GITHUB_ENV"

      # Runners are thrown away after each run, so a development certificate's private key
      # never survives. Instead: ad-hoc sign the archive (keeps entitlements such as the App
      # Group, needs no certificate), then let Apple's cloud-managed distribution certificate
      # sign the export via the API key.
      - name: Archive (ad-hoc signed)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project TodoApp.xcodeproj \
            -scheme TodoApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TodoApp.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            | tee archive.log | grep -E "error:|warning:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log

      - name: Create temporary distribution certificate and profiles
        env:
          BUNDLE_IDS: com.erijako.onestep,com.erijako.onestep.widget
        run: ruby .github/scripts/asc_signing.rb setup

      - name: Export signed .ipa
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TodoApp.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          ls -la "$RUNNER_TEMP/export"

      - name: Upload to App Store Connect
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$KEY_PATH" ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          xcrun altool --upload-app --type ios \
            --file "$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)" \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - name: Revoke temporary certificate and delete profiles
        if: always()
        run: ruby .github/scripts/asc_signing.rb cleanup || true

      - name: Clean up key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys" ~/.appstoreconnect
